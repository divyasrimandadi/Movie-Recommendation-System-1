<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: url('https://th.bing.com/th/id/OIP.O5bvUkrcviRi--qkRtBObAHaHa?w=1300&h=1300&rs=1&pid=ImgDetMain') no-repeat center center fixed;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            text-align: center;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            filter: brightness(1.2) blur(2px);
            z-index: -1;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 3px 3px 10px rgba(255, 215, 0, 0.8);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.9);
            margin-bottom: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            width: 50%;
            text-align: center;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            height: 35px;
            font-size: 14px;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-primary {
            width: 50%;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="title">🎬 Movie Recommendation System 🎬</div>
    <div class="subtitle">Find movies tailored to your taste</div>

    <div class="container">
        <form action="/recommend" method="POST">
            <div class="mb-2">
                <label for="genre">Preferred Genre:</label>
                <select name="genre" id="genre" class="form-control">
                    <option value="">Select Genre</option>
                    <option value="Action">Action</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Drama">Drama</option>
                    <option value="Horror">Horror</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Romance">Romance</option>
                </select>
            </div>
            <div class="mb-2">
                <label for="year">Preferred Release Year:</label>
                <input type="number" name="year" id="year" class="form-control" placeholder="Enter year (e.g., 2020)">
            </div>
            <div class="mb-2">
                <label for="language">Preferred Language:</label>
                <input type="text" name="language" id="language" class="form-control" placeholder="Enter language (e.g., English, Spanish)">
            </div>
            <div class="mb-2">
                <label for="rating">Minimum IMDb Rating:</label>
                <input type="number" name="rating" id="rating" class="form-control" placeholder="Enter rating (1-10)" step="0.1" min="1" max="10">
            </div>
            <button type="submit" class="btn btn-primary">Get Recommendations</button>
        </form>
    </div>
</body>
</html>
