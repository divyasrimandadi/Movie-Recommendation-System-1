<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: url('https://wallpapercave.com/wp/wp3160279.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            overflow: hidden;
            position: relative;
        }
        
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            filter: blur(5px); /* Reduced blur effect */
            z-index: -1;
        }
        
        .container {
            margin-top: 50px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            position: relative;
            z-index: 1;
        }
        
        label {
            font-weight: bold;
        }
        
        .form-control {
            background: rgba(255, 255, 255, 0.2); /* Slight transparency */
            border: none;
            color: white;
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1>Movie Recommendation System</h1>
        <p>Find movies tailored to your taste</p>
        
        <form id="recommendationForm" onsubmit="event.preventDefault(); redirectToRecommendations();">
            <div class="mb-3">
                <label for="genre">Preferred Genre:</label>
                <select id="genre" class="form-control">
                    <option value="">Select Genre</option>
                    <option value="Action">Action</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Drama">Drama</option>
                    <option value="Horror">Horror</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Romance">Romance</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="year">Preferred Release Year:</label>
                <input type="number" id="year" class="form-control" placeholder="Enter year (e.g., 2020)">
            </div>
            <div class="mb-3">
                <label for="language">Preferred Language:</label>
                <input type="text" id="language" class="form-control" placeholder="Enter language (e.g., English, Spanish)">
            </div>
            <div class="mb-3">
                <label for="rating">Minimum IMDb Rating:</label>
                <input type="number" id="rating" class="form-control" placeholder="Enter rating (1-10)" step="0.1" min="1" max="10">
            </div>
            <button type="submit" class="btn btn-primary">Get Recommendations</button>
        </form>
    </div>

    <script>
        function redirectToRecommendations() {
            window.location.href = 'recommend.html';
        }
    </script>
</body>
</html>
