<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background: url('https://source.unsplash.com/1920x1080/?cinema,movie,theater') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            backdrop-filter: blur(5px);
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .icons {
            font-size: 40px;
            margin-bottom: 20px;
        }
        .icons span {
            margin: 0 10px;
        }
        .input-group {
            margin: 15px 0;
            text-align: left;
        }
        label {
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            background: #222;
            color: white;
        }
        button {
            background: red;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            margin-top: 20px;
            width: 100%;
            text-transform: uppercase;
        }
        button:hover {
            background: darkred;
        }
        @media (max-width: 768px) {
            .container {
                width: 90%;
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Movie Recommendation System 🎥</h1>
        <div class="icons">
            <span>🎞️</span>
            <span>🍿</span>
            <span>🎥</span>
            <span>📽️</span>
        </div>
        <form action="/recommend" method="POST">
            <div class="input-group">
                <label for="movie_name">Favorite Movie</label>
                <input type="text" id="movie_name" name="movie_name" placeholder="Enter a movie you like..." required>
            </div>
            <div class="input-group">
                <label for="genre">Preferred Genre</label>
                <select id="genre" name="genre">
                    <option value="">Select Genre</option>
                    <option value="Action">Action</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Drama">Drama</option>
                    <option value="Horror">Horror</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Romance">Romance</option>
                </select>
            </div>
            <div class="input-group">
                <label for="year">Release Year</label>
                <input type="number" id="year" name="year" placeholder="e.g., 2010">
            </div>
            <div class="input-group">
                <label for="actor">Favorite Actor</label>
                <input type="text" id="actor" name="actor" placeholder="Enter an actor's name">
            </div>
            <button type="submit">🎬 Recommend Movies 🍿</button>
        </form>
    </div>
</body>
</html>
