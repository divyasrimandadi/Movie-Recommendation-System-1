<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommended Movies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background: url('https://source.unsplash.com/1920x1080/?cinema,movie') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            min-height: 100vh;
            backdrop-filter: blur(5px);
            color: white;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 10px;
            width: 80%;
            max-width: 1000px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sub-text {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ffcc00;
        }
        .movies {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .movie-card {
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.3s;
        }
        .movie-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-bottom: 2px solid red;
        }
        .movie-card p {
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        .back-btn {
            background: red;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            margin-top: 20px;
            width: 100%;
            text-transform: uppercase;
        }
        .back-btn:hover {
            background: darkred;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Recommended Movies 🍿</h1>
        <p class="sub-text">Based on your preferences: <strong>{{ user_input }}</strong></p>
        <div class="movies">
            {% for movie, poster in movies %}
            <div class="movie-card">
                <img src="{{ poster }}" alt="{{ movie }}">
                <p>{{ movie }}</p>
            </div>
            {% endfor %}
        </div>
        <button class="back-btn" onclick="window.location.href='/'">🔙 Go Back</button>
    </div>
</body>
</html>
