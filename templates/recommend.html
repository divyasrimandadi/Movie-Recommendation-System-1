<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommended Movies</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: url('https://wallpapercave.com/wp/wp3160279.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            overflow: hidden;
            position: relative;
        }
        
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            filter: blur(5px); /* Reduced blur effect */
            z-index: -1;
        }
        
        .container {
            margin-top: 50px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            margin-bottom: 20px;
        }
        
        .movie-list {
            list-style: none;
            padding: 0;
        }
        
        .movie-list li {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1>Recommended Movies</h1>
        <ul class="movie-list" id="movieList">
            <!-- Movie recommendations will be inserted here -->
        </ul>
        <button class="btn btn-secondary" onclick="goBack()">Back to Home</button>
    </div>

    <script>
        function goBack() {
            window.location.href = 'index.html';
        }

        // Dummy movie recommendations (can be replaced with actual data fetching logic)
        let recommendations = ["Inception", "Interstellar", "The Dark Knight", "Memento", "The Prestige"];
        let movieList = document.getElementById("movieList");

        recommendations.forEach(movie => {
            let listItem = document.createElement("li");
            listItem.textContent = movie;
            listItem.classList.add("list-group-item", "bg-dark", "text-white");
            movieList.appendChild(listItem);
        });
    </script>
</body>
</html>
