<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: url('https://th.bing.com/th/id/OIP.O5bvUkrcviRi--qkRtBObAHaHa?w=1300&h=1300&rs=1&pid=ImgDetMain') no-repeat center center fixed;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            text-align: center;
            min-height: 100vh;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            width: 60%;
            margin-top: 50px;
        }

        .movie-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            margin: 10px;
            text-align: center;
        }

        .movie-card img {
            border-radius: 10px;
            width: 100%;
            max-height: 300px;
            object-fit: cover;
        }

        .btn-home {
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-warning">🎬 Recommended Movies 🎬</h2>
        <div class="row">
            {% for movie in movies %}
            <div class="col-md-4">
                <div class="movie-card">
                    <img src="https://img.omdbapi.com/?i={{ movie.imdb_id }}&apikey= d330bfd7" alt="{{ movie.title }}">
                    <h5 class="mt-2">{{ movie.title }}</h5>
                </div>
            </div>
            {% endfor %}
        </div>
        <a href="/" class="btn btn-primary btn-home">Back to Home</a>
    </div>
</body>
</html>
