<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: url('https://th.bing.com/th/id/OIP.O5bvUkrcviRi--qkRtBObAHaHa?w=1300&h=1300&rs=1&pid=ImgDetMain') no-repeat center center fixed;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            text-align: center;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            filter: brightness(1.2) blur(2px);
            z-index: -1;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 3px 3px 10px rgba(255, 215, 0, 0.8);
            margin-bottom: 10px;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            width: 50%;
            text-align: center;
        }

        .table {
            color: white;
        }

        .btn-home {
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="title">🎬 Recommended Movies 🎬</div>

    <div class="container">
        {% if movies %}
            <table class="table table-dark table-bordered">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Year</th>
                        <th>IMDb Rating</th>
                    </tr>
                </thead>
                <tbody>
                    {% for movie in movies %}
                    <tr>
                        <td>{{ movie.title }}</td>
                        <td>{{ movie.year }}</td>
                        <td>{{ movie.rating }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p>No movies found matching your preferences. Try different filters.</p>
        {% endif %}

        <a href="/" class="btn btn-primary btn-home">Back to Home</a>
    </div>
</body>
</html>
